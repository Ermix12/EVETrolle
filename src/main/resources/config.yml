      title: "&4&lKONIEC ŚWIATA"
      subtitle: "&cTo już koniec..."
      start-sound: "entity.wither.spawn 0.35 0.5"
      start-sound-2: "entity.ender_dragon.growl 0.8 0.6"
      flight-sound: "item.firecharge.use 2 0.5"
      impact-sound: "entity.generic.explode 4 0.7"
      thunder-sound: "entity.lightning_bolt.thunder 8 1"
      bolt-impact-sound: "entity.lightning_bolt.impact 4 1"

# ------------------------------------------------------------
#  Własne trolle (bez programowania)
#  Akcje: [TITLE] tytuł;podtytuł[;fadeIn;stay;fadeOut]  [ACTIONBAR] tekst  [CHAT] tekst
#         [SOUND] klucz głośność wysokość  [PARTICLE] NAZWA ilość rozrzut prędkość
#         [BOSSBAR] tekst  [DELAY] ticki
#  Placeholdery: {player} {admin} oraz PlaceholderAPI (%...%).
#  Własne trolle w Javie: patrz README (EVETrolleAPI).
# ------------------------------------------------------------
custom-trolls:
  update-notch:
    enabled: true
    material: PAPER
    name: "&b&lWiadomość od Notcha"
    lore:
      - "&7Przykładowy własny troll"
      - "&7zdefiniowany w config.yml."
    duration: 8
    actions:
      - "[SOUND] ui.toast.challenge_complete 1 1"
      - "[TITLE] &6&lOsiągnięcie odblokowane;&7Zostałeś wybrany przez administrację"
      - "[DELAY] 40"
      - "[CHAT] &e{player} &7otrzymał osiągnięcie &a[Szczęściarz]"
      - "[PARTICLE] TOTEM_OF_UNDYING 40 0.6 0.3"
