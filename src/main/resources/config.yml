        - "entity.warden.heartbeat 1 1"
        - "entity.warden.nearby_close 0.8 1"
        - "entity.warden.listening 0.7 1"
        - "entity.warden.ambient 0.8 0.8"
        - "entity.warden.sniff 0.8 1"
      whispers:
        - "ambient.soul_sand_valley.additions 0.8 1"
        - "entity.vex.ambient 0.6 0.5"
        - "ambient.crimson_forest.additions 0.8 0.7"
