    enabled: true
    slot: 23
    material: GLOW_ITEM_FRAME
    name: "&d&lFake Streamer Mode"
    lore:
      - "&7Na ekranie pojawiają się"
      - "&7fałszywe wiadomości administracji."
    duration: 20
    options:
      interval-ticks: 60
      format: "&8[&4Administracja&8] &c{msg}"
      title: "&c&l● LIVE"
      subtitle: "&7Wiadomości od administracji"
      sound: "block.note_block.pling 1 1.5"
      messages:
