        - "entity.warden.nearby_close 0.8 1"
        - "ambient.cave 1 0.8"
  scary-sounds:
    enabled: true
    slot: 22
    material: SCULK_SHRIEKER
    name: "&5&lStraszne Dźwięki"
    lore:
      - "&7Cave sounds, Warden,"
      - "&7szepty i kroki."
    duration: 20
    options:
      interval-min-ticks: 25
      interval-max-ticks: 70
