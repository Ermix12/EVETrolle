# ============================================================
#  EVETrolle - messages.yml
#  Kody & / &#RRGGBB lub MiniMessage. Placeholdery w {nawiasach}.
#  Dostępne wszędzie: {prefix}. PlaceholderAPI (%...%) działa dla graczy.
# ============================================================
prefix: "&8[&cEVE&4Trolle&8] &7"

errors:
  no-permission: "{prefix}&cNie masz uprawnień do tej akcji."
  player-only: "{prefix}&cTę komendę może wykonać tylko gracz."
  player-not-found: "{prefix}&cNie znaleziono gracza &e{target}&c."
  target-offline: "{prefix}&cTen gracz jest już offline."
  unknown-troll: "{prefix}&cNieznany troll: &e{troll}&c. Użyj &f/evetrolle list&c."
  disabled: "{prefix}&cTroll &e{troll} &cjest wyłączony w konfiguracji."
  target-exempt: "{prefix}&cGracz &e{target} &cjest chroniony przed trollami."
  self-not-allowed: "{prefix}&cNie możesz trollować samego siebie."
  world-disabled: "{prefix}&cTrolle są wyłączone w świecie tego gracza."
  cooldown: "{prefix}&cPoczekaj jeszcze &e{seconds}s &cprzed ponownym użyciem tego trolla."
  already-active: "{prefix}&cTen gracz ma już aktywnego trolla."
  limit-reached: "{prefix}&cOsiągnięto limit jednoczesnych trolli na serwerze ({max})."
  cancelled: "{prefix}&cUruchomienie trolla zostało anulowane."

result:
  success: "{prefix}&aUruchomiono &e{troll} &ana graczu &e{target}&a."

reload:
  success: "{prefix}&aPrzeładowano config.yml i messages.yml."
  failed: "{prefix}&cBłąd podczas przeładowania: &f{error}"

stop:
  success: "{prefix}&aZatrzymano trolla gracza &e{target}&a."
  none: "{prefix}&7Gracz &e{target} &7nie ma aktywnego trolla."

usage:
  troll: "{prefix}&cUżycie: &f/evetrolle troll <gracz> [id]"
  troll-console: "{prefix}&cZ konsoli podaj ID trolla: &f/evetrolle troll <gracz> <id>"
  stop: "{prefix}&cUżycie: &f/evetrolle stop <gracz>"

list:
  header: "{prefix}&7Dostępne trolle:"
  entry: "&8 - &e{id} &8» &f{troll} &7({duration}s)"

help:
  - "&8&m          &r &cEVETrolle &8&m          "
  - "&e/evetrolle &8- &7otwiera menu trolli"
  - "&e/evetrolle troll <gracz> [id] &8- &7menu trolli lub bezpośrednie uruchomienie"
  - "&e/evetrolle stop <gracz> &8- &7zatrzymuje trolla"
  - "&e/evetrolle list &8- &7lista trolli"
  - "&e/evetrolle reload &8- &7przeładowanie konfiguracji"

# Powiadomienie dla administratorów (evetrolle.notify)
notify:
  troll-used: "{prefix}&e{admin_prefix}{admin} &7użył trolla &c{troll} &7na graczu &e{target}&7."

# Log w konsoli (bez kolorów)
log:
  troll-used: "{admin} uruchomił trolla '{troll}' na graczu {target} (świat: {world})"
